<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="pb-site-base" content="">
    <title>News &amp; Release Notes — Pandesal Bytes</title>
    <link rel="icon" type="image/jpeg" href="../assets/pb-logo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="company-hero">
        <div class="container">
            <span class="section-eyebrow-pill" data-i18n-key="updates.eyebrow">News &amp; Release Notes</span>
            <h1 class="hero-title" style="text-align: left;" data-i18n-key="updates.hero.title">Updates</h1>
            <p class="company-lead" data-i18n-key="updates.hero.lead">Product updates, release notes, and studio announcements from Pandesal Bytes.</p>
        </div>
    </section>

    <main class="container">
        <section class="page-section page-section--tight-top">

            <header class="section-block-head">
                <h2 class="section-block-title" id="filter-label" data-i18n-key="updates.all-posts">All Posts</h2>
                <span class="section-block-label" id="filter-count" aria-hidden="true"></span>
            </header>
            <div class="section-block-rule" role="presentation"></div>

            <div id="filter-bar" class="updates-filter-bar" style="display: none;"></div>
            <div id="posts-container" class="updates-posts-grid"></div>
            <p id="posts-empty" class="updates-empty" style="display: none;" data-i18n-key="updates.empty">No updates yet. Check back soon.</p>

        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../shared/paths.js"></script>
    <script src="../shared/products.js"></script>
    <script src="../shared/scripts.js" defer></script>
    <script>
        const PRODUCT_NAMES = Object.assign({
            'camerashelf':      'Camera Shelf',
            'camerapouch':      'CamPouch',
            'campouch':         'CamPouch',
            'simulatedfilm':    'Simulated Film',
            'spent-today':      'Spent Today',
            'inventory':        'My Inventory Stack',
            'archiveshelf':     'ArchiveShelf',
            'habit-habit':      'Habit Habit',
            'pattern-projects': 'Pattern Projects',
            'recipe-mini':      'Recipe Mini',
            'vocab-bento':      'Vocab Bento',
            'slideshow-frames': 'Slideshow Frames',
            'os39':             'OS-39',
        }, window.PB_PRODUCT_NAMES || {});

        function formatDate(dateStr) {
            const lang = window.__pbLang === 'ja' ? 'ja-JP' : 'en-US';
            const d = new Date(dateStr + 'T12:00:00');
            return d.toLocaleDateString(lang, { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function renderPosts(posts) {
            const container = document.getElementById('posts-container');
            const empty     = document.getElementById('posts-empty');
            const readMore  = (window.__pbTranslations && window.__pbTranslations['home.updates.readmore']) || 'Read more →';
            container.innerHTML = '';
            if (posts.length === 0) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            posts.forEach(post => {
                const tagHTML = post.tags.map(t =>
                    `<span class="post-tag">${PRODUCT_NAMES[t] || t}</span>`
                ).join('');
                const card = document.createElement('a');
                card.href = `post.html?slug=${encodeURIComponent(post.slug)}`;
                card.className = 'post-card card-style';
                card.innerHTML = `
                    <div class="post-card-inner">
                        <div>
                            <div class="post-card-meta">
                                <span class="post-date">${formatDate(post.date)}</span>
                                ${tagHTML ? `<div class="post-tags">${tagHTML}</div>` : ''}
                            </div>
                            <h2 class="post-card-title">${post.title}</h2>
                            <p class="post-card-excerpt">${post.excerpt}</p>
                        </div>
                        <span class="post-read-more">${readMore}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function applyFilter(tag, posts) {
            const matchTags = (tag === 'campouch' || tag === 'camerapouch') ? ['campouch', 'camerapouch'] : [tag];
            const filtered = tag ? posts.filter(p => p.tags.some(t => matchTags.includes(t))) : posts;
            renderPosts(filtered);
            const filterLabel = document.getElementById('filter-label');
            const filterCount = document.getElementById('filter-count');
            const allLabel = (window.__pbTranslations && window.__pbTranslations['updates.all-posts']) || 'All Posts';
            if (filterLabel) filterLabel.textContent = tag ? (PRODUCT_NAMES[tag] || tag) : allLabel;
            if (filterCount) filterCount.textContent = filtered.length > 0 ? String(filtered.length) : '';
        }

        let cachedPosts = [];
        let activeTagState = '';

        async function init() {
            try {
                const res = await fetch('posts.json');
                cachedPosts = await res.json();
            } catch (e) {
                document.getElementById('posts-empty').style.display = 'block';
                return;
            }

            const params = new URLSearchParams(window.location.search);
            activeTagState = params.get('tag') || '';

            const allTags = [...new Set(cachedPosts.flatMap(p => p.tags))];
            const filterBar = document.getElementById('filter-bar');

            if (allTags.length > 0) {
                filterBar.style.display = 'flex';

                const allBtn = document.createElement('button');
                allBtn.className = 'filter-btn' + (activeTagState === '' ? ' active' : '');
                allBtn.textContent = 'All';
                allBtn.dataset.tag = '';
                filterBar.appendChild(allBtn);

                allTags.forEach(tag => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn' + (activeTagState === tag ? ' active' : '');
                    btn.textContent = PRODUCT_NAMES[tag] || tag;
                    btn.dataset.tag = tag;
                    filterBar.appendChild(btn);
                });

                filterBar.addEventListener('click', e => {
                    const btn = e.target.closest('.filter-btn');
                    if (!btn) return;
                    filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeTagState = btn.dataset.tag;
                    applyFilter(activeTagState, cachedPosts);
                    const newUrl = activeTagState
                        ? `?tag=${encodeURIComponent(activeTagState)}`
                        : window.location.pathname;
                    history.pushState({ tag: activeTagState }, '', newUrl);
                });
            }

            window.addEventListener('popstate', e => {
                activeTagState = e.state?.tag ?? new URLSearchParams(window.location.search).get('tag') ?? '';
                filterBar.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.tag === activeTagState);
                });
                applyFilter(activeTagState, cachedPosts);
            });

            applyFilter(activeTagState, cachedPosts);
        }

        window.onPandesalTranslationsReady = function () {
            if (cachedPosts.length) applyFilter(activeTagState, cachedPosts);
        };

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
